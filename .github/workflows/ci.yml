name: CI/CD Pipeline Python



on:

  push:

    branches: [ "**" ]

  pull_request:

    branches: [ "main" ]



jobs:

  test:

    runs-on: ubuntu-latest

    

    steps:

      # 1. Obter o código do repositório

      - name: Checkout do código

        uses: actions/checkout@v4



      # 2. Configurar o ambiente Python

      - name: Configurar o Python

        uses: actions/setup-python@v5

        with:

          python-version: '3.11'

          cache: 'pip'



      # 3. Instalar as dependências

      - name: Instalar dependências

        run: |

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

          # Instala dependências de teste caso use pytest

          pip install pytest



      # 4. Executar os testes automaticamente

      # 5. Impedir o processo de delivery se algum teste falhar (o job falha automaticamente se o comando retornar erro)

      - name: Executar testes automatizados

        run: |

          pytest



  release:

    needs: test

    runs-on: ubuntu-latest

    # Executa apenas se o job de testes for bem-sucedido e o commit for na branch main por push

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    

    steps:

      - name: Checkout do código

        uses: actions/checkout@v4



      # 6. Gerar um artefato quando o código da branch main estiver aprovado

      - name: Gerar e carregar artefato

        uses: actions/upload-artifact@v4

        with:

          name: app-release-artifact

          path: |

            .

            !tests/

            !.git/

          retention-days: 30
